name: Generate and validate suggestion JSON Schema

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  validate-schema:
    name: Validate suggestion JSON Schema
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
        shell: bash

      - name: Generate suggestion schema into a temp file
        run: |
          python scripts/generate_suggestion_schema.py --output .suggestions/suggestion_schema.generated.json

      - name: Check generated schema matches committed artifact (normalized JSON)
        run: |
          python scripts/compare_suggestion_schema.py

      - name: Cleanup generated file
        if: ${{ always() }}
        run: |
          python scripts/cleanup_generated_schema.py
