name: CI

on:
  push:
    branches: [ main, master, '**/ci/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Prepare scripts for hooks tests
        run: |
          mkdir -p .github/agents/Orchestrator/scripts
          cp -r scripts/* .github/agents/Orchestrator/scripts/
        shell: bash

      - name: Run tests
        env:
          ORCHESTRATOR_SKIP_AUTOINIT: '1'
        run: |
          pytest -q

      - name: Lint with ruff (optional)
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check . || true
          else
            echo "ruff not installed; skipping lint step"
          fi

  verify_package:
    name: Verify packaged manifest
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python package_orchestrator.py
          ls -l Orchestrator.zip || true

      - name: Validate skills_manifest.json inside package
        run: |
          python scripts/validate_package_manifest.py
