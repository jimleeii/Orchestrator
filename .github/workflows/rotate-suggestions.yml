name: Rotate suggestions

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch: {}

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run rotate suggestions
        run: |
          python scripts/rotate_suggestions.py --suggestions .suggestions/suggestions.jsonl --max-size-mb 10 --max-age-days 30 --keep-days 90 --keep-count 10
