name: Rotate suggestions (Windows)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC

jobs:
  rotate:
    name: Rotate suggestions (Windows runner)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run rotate_suggestions
        run: |
          python scripts/rotate_suggestions.py --repo-root . --max-size-mb 50 --max-age-days 7 --keep-days 30 --keep-count 20
